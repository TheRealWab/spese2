<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Spese</title>
  <meta name="description" content="Spese, entrate e patrimonio: i tuoi dati restano sul tuo telefono.">
  <meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0b0f" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Applica subito il tema scelto, prima del primo disegno, per evitare il lampo di colore sbagliato.
       La chiave ha il prefisso spese2_ perché l'origine è condivisa con altre app. -->
  <script>
    try {
      var t = localStorage.getItem('spese2_tema');
      if (t === 'chiaro' || t === 'scuro') document.documentElement.dataset.tema = t;
    } catch (e) { /* storage non disponibile: vale il tema di sistema */ }
  </script>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/inserimento.css">
  <link rel="stylesheet" href="css/flusso.css">
  <link rel="stylesheet" href="css/importa.css">
  <link rel="stylesheet" href="css/viste.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <main id="vista" tabindex="-1"></main>
    <button type="button" id="fab" class="fab" aria-label="Aggiungi un movimento"></button>
    <nav class="nav" aria-label="Aree dell'app"><div class="nav-interno" id="nav"></div></nav>
  </div>

  <div id="strato-pannelli"></div>
  <div id="strato-toast" aria-live="polite"></div>

  <noscript><p style="padding:24px;font-family:system-ui">Per usare Spese serve JavaScript.</p></noscript>
</body>
</html>
